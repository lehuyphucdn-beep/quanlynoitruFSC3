<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Shield / Inner container -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Dormitory Roof structure -->
  <polygon points="256,128 396,220 364,220 364,364 148,364 148,220 116,220" fill="#ffffff" />
  <polygon points="256,128 396,220 364,220 256,150 148,220 116,220" fill="url(#roof)" />

  <!-- Dormitory building body -->
  <rect x="164" y="228" width="184" height="136" rx="8" fill="#f8fafc" />

  <!-- Dorm Windows & Rooms Grid -->
  <rect x="184" y="248" width="36" height="36" rx="6" fill="#3b82f6" />
  <rect x="238" y="248" width="36" height="36" rx="6" fill="#3b82f6" />
  <rect x="292" y="248" width="36" height="36" rx="6" fill="#3b82f6" />

  <!-- Entrance Door with Star -->
  <path d="M 232 364 L 232 308 A 24 24 0 0 1 280 308 L 280 364 Z" fill="#2563eb" />
  <circle cx="256" cy="326" r="5" fill="#facc15" />

  <!-- Badge / Excellence checkmark on bottom right -->
  <circle cx="372" cy="372" r="54" fill="#10b981" stroke="#ffffff" stroke-width="8" />
  <path d="M 352 372 L 366 386 L 396 354" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
